# pypack 全局配置：单一事实来源
#
# 约定：
#   - 路径一律相对 pypack/ 根目录书写；由 batfd/config.py 解析成绝对路径。
#   - 凡标注「推断」的项都不是文档事实，而是由数值吻合得出的假设，
#     结论性报告里必须同样标注。
#   - 凡未跑过实验得出的数字，这里一律不留占位值。

paths:
  data_dir: "data"          # 四个 Stand*.mat 所在目录（仓库根下；已 gitignore，不入库）
  outputs_dir: "outputs"    # 本项目的运行产物根目录

data:
  files:
    train: "StandTrainData.mat"
    test1: "StandTestData1.mat"
    test2: "StandTestData2.mat"
    test3: "StandTestData3.mat"
  # 字段名在四个文件间不统一，按序尝试（实测：train=ThisTrainID, test1=ThisID1, test2/3=ThisID）
  id_varnames: ["ThisTrainID", "ThisID1", "ThisID"]
  time_varname: "ThisTimeSlot"       # 仅 test1/2/3 有；train 无时间
  hidden_varname: "Hiddall"          # 仅 train/test1 有
  signal_varname: "Xall"
  expected_rows: 256                 # 时间步
  expected_cols: 20                  # 通道数

channels:
  # 列号一律 1-based，与 MATLAB 习惯一致，便于与 diag_report 对照
  cell_voltage: [1, 3, 5, 7, 9, 11, 13, 15]   # 实测：奇数列 = 8 路单体电压
  current:      [2, 4, 6, 8, 10, 12, 14, 16]  # 实测：偶数列两两相关 1.000，逐位相同
  temperature:  [17, 18, 19, 20]              # 实测：独立簇，粗量化，语义无文档
  # 量纲换算（推断，非文档）：来自与论文数值范围的吻合，不做断言
  #   奇数列 mean≈0.346，+3.0 后落在 2.94~3.65 V，与论文「单体电压 3.0~3.6 V」吻合
  #   偶数列 min≈-1.886，×100 后为 -188.6 A，与论文「放电 0~-200 A」吻合
  voltage_offset: 3.0
  current_scale: 100.0
  # true 时输入只保留 1 路电流（消融 E）。默认 false 以保持与论文同为 20 通道
  dedup_current: false

hidden:
  # Hiddall [1x9xN] 的语义（推断，见 plan 1.3 的四条数值证据）
  soc_channel: 1
  # 第 2..9 通道 -> 单体 1..8。顺序尚未验证，P2 用逐包发散通道对照真实 Table 5 确认
  resistance_channels: [2, 3, 4, 5, 6, 7, 8, 9]

split:
  mode: chrono        # 按 ID 内时间顺序切分，绝不随机打散
  val_ratio: 0.15     # 每 ID 取时间尾部 15% 作验证
  seed: 42

model:
  # 消融主开关：false 时退化成「一个共享潜向量广播给所有单体」，
  # 即论文那种「未指定哪个潜变量对哪个单体」的形态
  cell_resolved: true
  # 潜变量维度。最初设 cell=4 / pack=8（共 12 维），实测重建能力严重不足，
  # 因此放宽容量。本方法的检测依赖重建误差作故障信号，重建太弱会让建模误差
  # 盖过故障信号。结构约束（槽位 c 只依赖单体 c 自身信号）不变。
  #
  # ⚠ 2026-09-27 复核：此处原注释写「基线 LFAAE 的 val MSE 0.0087，本模型只到
  #   0.599（差约 70 倍）」，其中 0.599 与 70 倍两处都不成立：
  #     · 0.0087 可复核：lfaae 的 val_mse 最优 = 0.00873（epoch 298，
  #       来源 outputs/runs/lfaae/history.csv）。
  #     · 0.599 在任何一个 history.csv 里都**不是**重建量 —— 它只出现在
  #       train_late_res / val_late_res / val_late_soc 这几列，即**物理对齐残差**。
  #     · 真实重建比值：ours_full 在 val_loss 最优 epoch 的 val_recon = 0.03173，
  #       0.03173 / 0.00873 ≈ **3.6 倍**，不是 70 倍。两者同为「对稳健标准化后
  #       电压的 MSE」（lfaae.py 的 mse_loss(model(x), cell_norm(v)) ↔ losses.py
  #       的 F.mse_loss(v_hat, v_norm)），口径可比；但注意两个模型选权重的判据
  #       不同（基线按 val_mse，本方法按 val_loss）。
  #   放宽容量的决定与已训练权重不变，仅订正此处给出的理由。
  cell_latent: 16         # e_c 维度
  cell_phys_slots: 1      # a_c：对齐该单体内阻的物理槽（论文的「a subset of latent variables」）
  pack_latent: 32         # p 维度
  pack_phys_slots: 1      # 对齐 SOC 的物理槽
  cell_conv: [32, 32, 32]
  pack_conv: [64, 64, 32]
  decoder_hidden: 64      # 解码器上采样前的通道数
  use_sibling_context: false   # 解码时是否喂入兄弟单体潜变量（默认否，避免邻胞信息掩盖单胞故障）
  # 给解码器接一路电流直通支路（当前默认开）。
  # 设计理由：电压波形主要由电流波形驱动，而电流被压成全局向量后，解码器要从
  # 该向量重塑出 256 步时序形状；电流是外生输入、编解码两端都可见，故直接旁路。
  # 关键约束：**单体特有的偏差仍必须走潜变量** —— 直通支路对所有单体输出相同，
  # 单胞故障无法被它吸收，仍会留在重建残差里，那正是检测所要的信号。
  #
  # ⚠ 2026-09-27 复核：此处原注释写「已实测证明必要，勿关」，并给出三行对照
  #   （0.175 / 0.152 / 0.0288，称「改善 6 倍」「容量加 4 倍只改善 13%」）。
  #   这三个数本身能在 outputs/runs/*/history.csv 里查到，但**不构成同口径对照**：
  #   它们分属三个不同的消融配置，且混用了 val_loss 与 val_recon 两列
  #   （0.17521 = ours_no_kl ep35 的 val_loss；0.15266 = ours_no_kl ep48 的
  #    val_loss 与 ours_no_late ep3 的 val_recon；0.02881 = ours_no_late_no_kl
  #    ep60，该配置 λ2=λ3=0 故两列同值）。
  #   六个配置在各自 val_loss 最优 epoch（即实际保存的权重）处的 val_recon
  #   落在 0.0240～0.0372，没有任何配置接近 0.175。
  #   因此**该支路是否必要尚无对照实验支持**，不要据原注释把它当成已证结论。
  decoder_current_skip: true
  variational: true            # 是否启用变分头以计算 L_reg(KL)
  norm_floor: 1.0e-3           # 稳健标准化的尺度下限（防止近零方差通道被放大）

train:
  device: auto
  batch_size: 256
  max_epochs: 300
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  patience: 20            # 验证集早停
  seed: 42
  amp: true
  # 损失权重。论文 Eq.(1) 只给了符号，全文未给 λ 取值 —— 报告中必须声明
  lambda1: 1.0            # L_recon
  lambda2: 0.1            # L_late（物理对齐）
  lambda3: 1.0e-3         # L_reg（KL）

baseline:
  # 论文基线 LFAAE 的两个未说明项（见 batfd/baselines/lfaae.py 的 docstring）
  activation: relu      # Table 1 未列激活；旧 MATLAB 脚本通篇无 ReLU
  use_bn: false         # Table 1 未提 BN；旧脚本每层都加

detect:
  score_normalize: true       # 标准化 24 维指标后再算 LOF（论文未说明是否标准化）
  lof_mode: train_novelty     # train_novelty | per_pack，两种都要跑并对比
  lof_n_neighbors: 20
  threshold_q: 0.99           # 论文：训练集 LOF 的 99 分位
  condition_threshold: true
  condition_method: conditional_cdf   # conditional_cdf | binned_quantile
  persistence_windows: 5      # 连续越限窗口数才判定报警
  # 逐包自身基线标准化的参照段比例（阈值口径 pack_baseline 用）。
  # 依据：每个包的记录都含一段明确的正常运行期，用**它自己**的正常期做参照，
  # 而不是拿别的包的正常期当基准 —— 后者在未见过的包上会整体失效
  # （实测：未见包的中位 LOF 1.34~2.23 已高于训练集 99 分位 1.62，
  #   导致 16%~98% 的正常窗口被判异常）。
  pack_baseline_frac: 0.10

onset:
  # 故障起点标签（仅 pack 6/8/9/10 有 Hiddall）
  baseline_frac: 0.30     # 用该包前 30% 窗口估计正常基线；起点只可能在基线之后
  k_grid: [3, 4, 5, 6]    # 偏差阈值倍数网格
  p_grid: [3, 5, 10, 20]  # 连续窗口数网格
  # 稳健尺度 σ 的绝对下限，取「典型内阻(mΩ) × 本比例」。
  # 必须有绝对下限：跨单体偏差以 0 为中心，纯相对下限在中位数近零时失效，
  # 会把某些单体的尺度估成 ~0，导致任何噪声都判越限（实测出现过 onset=0 的假结果）。
  sigma_floor_frac: 0.05

audit:
  # P0 深读哪一个文件做读通性验证（默认用最小的 test2 以省时间）
  probe_file: "StandTestData2.mat"
