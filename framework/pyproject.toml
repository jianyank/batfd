[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'chronoguard-ts'
version = '0.1.0'
description = 'Calibrated multichannel time-series anomaly detection with explicit streaming state'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = ['numpy>=1.24,<3', 'scikit-learn>=1.3,<2', 'joblib>=1.3,<2']

[project.optional-dependencies]
plot = ['matplotlib>=3.7,<4']

[tool.setuptools.packages.find]
where = ['src']
